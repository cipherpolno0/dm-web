name: Continuous Integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dhammastudy_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dhammastudy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      E2E_DATABASE_URL: postgresql://postgres@localhost:5432/dhammastudy_test?schema=public
      DATABASE_URL: postgresql://postgres@localhost:5432/dhammastudy_test?schema=public

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Run lint
        run: pnpm lint

      - name: Run strict type-check
        run: pnpm type-check

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit and end-to-end tests
        run: pnpm test:all

      - name: Build production application
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
        run: pnpm build

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
